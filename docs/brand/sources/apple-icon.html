<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Tamani — apple-icon (180×180)</title>
    <style>
      html,
      body {
        margin: 0;
        width: 180px;
        height: 180px;
        overflow: hidden;
        background: #1a4fbf;
      }
      /* Full-bleed square: iOS applies its own rounded mask. The mark is
     centred on its optical centre (24, 26.5 in the 48-unit viewBox). */
      img {
        position: absolute;
        left: 18px;
        top: 10.5px;
        width: 144px;
        height: 144px;
      }
    </style>
  </head>
  <body>
    <img src="../../../frontend/public/brand/tamani-mark.svg" alt="" />
  </body>
</html>
